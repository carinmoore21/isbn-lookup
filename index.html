<!DOCTYPE html>
<html>
<head>
    <title>ISBN Lookup Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }

        #results {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h1>Compendium ISBN Lookup</h1>

<p>Paste item numbers or UPCs below:</p>

<textarea id="input"></textarea>

<br>

<button onclick="lookup()">Lookup</button>

<div id="results"></div>

<script>
function lookup() {
    document.getElementById("results").innerText =
        "Success! The lookup tool is working.";
}
</script>

</body>
</html>
